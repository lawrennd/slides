<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="370" viewBox="0 0 420 370">
  <defs>
    <!-- Axis arrowhead -->
    <marker id="ax" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
    <!-- Trade-off arrowhead -->
    <marker id="tarr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#CC4400"/>
    </marker>
  </defs>

  <!--
    Plot area: x in [80, 340], y in [40, 300]  (260 x 260 px)
    x(s1) = 80 + 260*(s1/log d),   y(s2) = 300 - 260*(s2/log d)

    C = 1.2 log d  constraint segment (clipped to [0,log d]^2):
      A: (s1=log d, s2=0.2 log d) -> pixel (340, 248)
      B: (s1=0.2 log d, s2=log d) -> pixel (132, 40)
      Midpoint M = (236, 144)
  -->

  <!-- Axes -->
  <line x1="80" y1="300" x2="355" y2="300"
        stroke="currentColor" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="80" y1="300" x2="80" y2="27"
        stroke="currentColor" stroke-width="2" marker-end="url(#ax)"/>

  <!-- Axis labels (tspan subscripts) -->
  <text x="360" y="308" font-size="16" fill="currentColor" font-style="italic">s<tspan dy="5" font-size="11">1</tspan></text>
  <text x="68" y="20" text-anchor="end" font-size="16" fill="currentColor" font-style="italic">s<tspan dy="5" font-size="11">2</tspan></text>

  <!-- Tick: s1 = log d -->
  <line x1="340" y1="297" x2="340" y2="304" stroke="currentColor" stroke-width="1.5"/>
  <text x="340" y="320" text-anchor="middle" font-size="13" fill="currentColor">log <tspan font-style="italic">d</tspan></text>

  <!-- Tick: s2 = log d -->
  <line x1="76" y1="40" x2="84" y2="40" stroke="currentColor" stroke-width="1.5"/>
  <text x="72" y="44" text-anchor="end" font-size="13" fill="currentColor">log <tspan font-style="italic">d</tspan></text>

  <!-- Origin -->
  <text x="80" y="320" text-anchor="middle" font-size="13" fill="currentColor">0</text>

  <!-- Ceiling: s1 = log d  (dashed vertical) -->
  <line x1="340" y1="40" x2="340" y2="300"
        stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Ceiling: s2 = log d  (dashed horizontal) -->
  <line x1="80" y1="40" x2="340" y2="40"
        stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Ceiling labels -->
  <text x="344" y="185" font-size="12" fill="#888"><tspan font-style="italic">s</tspan><tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> = log <tspan font-style="italic">d</tspan></tspan></text>
  <text x="210" y="34" text-anchor="middle" font-size="12" fill="#888">s<tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> = log <tspan font-style="italic">d</tspan></tspan></text>

  <!-- Feasible square (faint guide) -->
  <rect x="80" y="40" width="260" height="260"
        fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- Constraint line: s1 + s2 = 1.2 log d,  A=(340,248) -> B=(132,40) -->
  <line x1="340" y1="248" x2="132" y2="40"
        stroke="#4477AA" stroke-width="2.5"/>

  <!-- Constraint label (below-right of centre, clear of arrows) -->
  <text x="258" y="218" font-size="14" fill="#4477AA"><tspan
  font-style="italic">s</tspan><tspan dy="5"
  font-size="10">1</tspan><tspan dy="-5"> + s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="8">2</tspan><tspan baseline-shift="sub" font-style="normal" font-size="8"> = C</tspan></text>
  <text x="258" y="235" font-size="12" fill="#4477AA">(conserved)</text>

  <!--
    Trade-off arrows from midpoint M=(236,144).
    Toward B (upper-left):  (236-42, 144-42) = (194, 102)
    Toward A (lower-right): (236+42, 144+42) = (278, 186)
  -->
  <line x1="236" y1="144" x2="196" y2="104"
        stroke="#CC4400" stroke-width="2" marker-end="url(#tarr)"/>
  <line x1="236" y1="144" x2="276" y2="184"
        stroke="#CC4400" stroke-width="2" marker-end="url(#tarr)"/>

  <!-- Trade-off labels (plain ASCII, near arrowheads) -->
  <text x="96" y="95" font-size="12" fill="#CC4400"><tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="9">2</tspan> rises, <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="9">1</tspan> falls</text>
  <text x="214" y="204" font-size="12" fill="#CC4400"><tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="9">1</tspan> rises, <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="10">2</tspan> falls</text>

  <!-- Caption -->
  <text x="210" y="350" text-anchor="middle" font-size="12" fill="#555">Conservation: <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="10">1</tspan> + <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-style="normal" font-size="10">2</tspan> = C fixed. If one rises, the other must fall.</text>
</svg>
