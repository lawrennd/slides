<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="490" height="400" viewBox="0 0 490 400">
  <defs>
    <!-- Axis arrowhead -->
    <marker id="ax2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>

  <!--
    Plot area: x in [80, 340], y in [40, 300]  (260 x 260 px)
    x(s1) = 80 + 260*(s1/log d),   y(s2) = 300 - 260*(s2/log d)

    C = 0.8 log d  (blue):    A=(288,300), B=(80,92)
    C = 1.4 log d  (orange):  A=(340,196), B=(184,40)
    C = C_max = 2 log d (red): single point (340,40)
  -->

  <!-- Axes -->
  <line x1="80" y1="300" x2="355" y2="300"
        stroke="currentColor" stroke-width="2" marker-end="url(#ax2)"/>
  <line x1="80" y1="300" x2="80" y2="27"
        stroke="currentColor" stroke-width="2" marker-end="url(#ax2)"/>

  <!-- Axis labels -->
  <text x="360" y="308" font-size="16" fill="currentColor" font-style="italic">s<tspan dy="5" font-size="11">1</tspan></text>
  <text x="68" y="20" text-anchor="end" font-size="16" fill="currentColor" font-style="italic">s<tspan dy="5" font-size="11">2</tspan></text>

  <!-- Ticks -->
  <line x1="340" y1="297" x2="340" y2="304" stroke="currentColor" stroke-width="1.5"/>
  <text x="340" y="320" text-anchor="middle" font-size="13" fill="currentColor">log d</text>
  <line x1="76" y1="40" x2="84" y2="40" stroke="currentColor" stroke-width="1.5"/>
  <text x="72" y="44" text-anchor="end" font-size="13" fill="currentColor">log d</text>
  <text x="80" y="320" text-anchor="middle" font-size="13" fill="currentColor">0</text>

  <!-- Ceiling: s1 = log d  (dashed vertical) -->
  <line x1="340" y1="40" x2="340" y2="300"
        stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>
  <!-- Ceiling: s2 = log d  (dashed horizontal) -->
  <line x1="80" y1="40" x2="340" y2="40"
        stroke="#888" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Ceiling labels -->
  <text x="344" y="270" font-size="12" fill="#888">s<tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> = log d</tspan></text>
  <text x="210" y="34" text-anchor="middle" font-size="12" fill="#888">s<tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> = log d</tspan></text>

  <!-- Feasible square (faint guide) -->
  <rect x="80" y="40" width="260" height="260"
        fill="none" stroke="#ddd" stroke-width="1"/>

  <!-- C = 0.8 log d  (blue): A=(288,300), B=(80,92) -->
  <line x1="288" y1="300" x2="80" y2="92"
        stroke="#4477AA" stroke-width="2.5"/>
  <text x="88" y="158" font-size="13" fill="#4477AA">C = 0.8 log d</text>

  <!-- C = 1.4 log d  (orange): A=(340,196), B=(184,40) -->
  <line x1="340" y1="196" x2="184" y2="40"
        stroke="#EE7733" stroke-width="2.5"/>
  <!-- Label near midpoint: ((340+184)/2, (196+40)/2) = (262,118), offset above -->
  <text x="220" y="96" font-size="13" fill="#EE7733">C = 1.4 log d</text>

  <!-- C = C_max = 2 log d  (red): single corner point (340,40) -->
  <circle cx="340" cy="40" r="7" fill="#CC3333"/>

  <!-- Leader line from red dot to annotation -->
  <line x1="347" y1="40" x2="378" y2="70"
        stroke="#CC3333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- LME origin annotation -->
  <text x="382" y="74" font-size="13" fill="#CC3333" font-weight="bold">C = C<tspan dy="4" font-size="9">max</tspan></text>
  <text x="382" y="91" font-size="13" fill="#CC3333">LME origin</text>
  <text x="382" y="108" font-size="12" fill="#CC3333">s<tspan dy="4" font-size="9">1</tspan><tspan dy="-4"> = s</tspan><tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> = log d</tspan></text>
  <text x="382" y="125" font-size="12" fill="#CC3333">grad C = 0 here</text>
  <text x="382" y="141" font-size="12" fill="#CC3333">-&gt; second-order</text>
  <text x="382" y="157" font-size="12" fill="#CC3333">   condition applies</text>

  <!-- C increasing indicator: dashed diagonal + small triangle (up-right) -->
  <line x1="118" y1="238" x2="165" y2="168"
        stroke="#555" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Upward-pointing arrowhead at end of dashed line -->
  <polygon points="165,162 161,172 169,172" fill="#555"/>
  <text x="76" y="250" font-size="12" fill="#555" font-style="italic">C up</text>

  <!-- Caption -->
  <text x="210" y="358" text-anchor="middle" font-size="12" fill="#555" font-style="italic">As C rises the accessible segment shrinks; at C = C_max it collapses to a single point.</text>
</svg>
