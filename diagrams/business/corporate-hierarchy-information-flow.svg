<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <defs>
    <!-- Standard forward arrowhead -->
    <marker id="arrowEnd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <!-- Backward arrowhead: reversed polygon, orient="auto" (no auto-start-reverse) -->
    <marker id="arrowStart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#333"/>
    </marker>
    <!-- Dashed signal arrowhead -->
    <marker id="arrowDashedEnd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Title -->
  <!--<text x="450" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#333">Hierarchical Information Flow</text>-->

  <!-- Legend -->
  <!--<rect x="670" y="150" width="210" height="65" rx="4" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>-->
  <!-- <line x1="682" y1="172" x2="720" y2="172" stroke="#333" stroke-width="2" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/> -->
  <!-- <text x="728" y="176" font-family="Arial" font-size="11" fill="#555">decisions / data</text> -->
  <!-- <line x1="682" y1="197" x2="720" y2="197" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDashedEnd)"/> -->
  <!-- <text x="728" y="201" font-family="Arial" font-size="11" fill="#777">external signals</text> -->

  <!-- External entities row -->
  <rect x="0" y="55" width="150" height="500" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="75" y="290" text-anchor="middle" font-family="Arial" font-size="14" fill="#555" font-style="italic">Customers</text>

  <rect x="750" y="55" width="150" height="500" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="825" y="290" text-anchor="middle" font-family="Arial" font-size="14" fill="#555" font-style="italic">Markets</text>

  <!-- <!-\- Dashed signals: Customers to CEO -\-> -->
  <!-- <line x1="195" y1="80" x2="378" y2="178" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDashedEnd)"/> -->
  <!-- <text x="272" y="118" text-anchor="middle" font-family="Arial" font-size="11" fill="#999" font-style="italic">signals</text> -->

  <!-- <!-\- Dashed signals: Markets to CEO -\-> -->
  <!-- <line x1="705" y1="80" x2="522" y2="178" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowDashedEnd)"/> -->
  <!-- <text x="628" y="118" text-anchor="middle" font-family="Arial" font-size="11" fill="#999" font-style="italic">signals</text> -->

  <!-- CEO -->
  <rect x="370" y="155" width="160" height="55" rx="6" fill="#fff3cd" stroke="#c9a800" stroke-width="2"/>
  <text x="450" y="187" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#6b4f00">CEO</text>

  <!-- CEO to CFO (bidirectional) -->
  <line x1="406" y1="210" x2="228" y2="300" stroke="#333" stroke-width="2"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- CEO to CIO (bidirectional) -->
  <line x1="450" y1="210" x2="450" y2="300" stroke="#333" stroke-width="2"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- CEO to COO (bidirectional) -->
  <line x1="494" y1="210" x2="672" y2="300" stroke="#333" stroke-width="2"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- C-suite row -->
  <rect x="120" y="300" width="130" height="50" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="2"/>
  <text x="185" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a4a7a">CFO</text>

  <rect x="385" y="300" width="130" height="50" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="2"/>
  <text x="450" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a4a7a">CIO</text>

  <rect x="650" y="300" width="130" height="50" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="2"/>
  <text x="715" y="330" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#1a4a7a">COO</text>

  <!-- CFO to Finance (bidirectional) -->
  <line x1="155" y1="350" x2="120" y2="430" stroke="#333" stroke-width="1.8"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- CFO to Risk (bidirectional) -->
  <line x1="215" y1="350" x2="250" y2="430" stroke="#333" stroke-width="1.8"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- CIO to IT Infra (bidirectional) -->
  <line x1="425" y1="350" x2="395" y2="430" stroke="#333" stroke-width="1.8"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- CIO to Analytics (bidirectional) -->
  <line x1="475" y1="350" x2="515" y2="430" stroke="#333" stroke-width="1.8"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- COO to Operations (bidirectional) -->
  <line x1="685" y1="350" x2="655" y2="430" stroke="#333" stroke-width="1.8"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- COO to HR (bidirectional) -->
  <line x1="745" y1="350" x2="778" y2="430" stroke="#333" stroke-width="1.8"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Department row -->
  <!-- Under CFO -->
  <rect x="55" y="430" width="120" height="45" rx="6" fill="#eaf4fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="115" y="457" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a4a7a">Finance</text>

  <rect x="192" y="430" width="120" height="45" rx="6" fill="#eaf4fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="252" y="457" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a4a7a">Risk</text>

  <!-- Under CIO -->
  <rect x="335" y="430" width="115" height="45" rx="6" fill="#eaf4fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="392" y="457" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a4a7a">IT Infra</text>

  <rect x="460" y="430" width="115" height="45" rx="6" fill="#eaf4fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="517" y="450" text-anchor="middle" font-family="Arial" font-size="12" fill="#1a4a7a">Data &amp;</text>
  <text x="517" y="466" text-anchor="middle" font-family="Arial" font-size="12" fill="#1a4a7a">Analytics</text>

  <!-- Under COO -->
  <rect x="590" y="430" width="120" height="45" rx="6" fill="#eaf4fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="650" y="457" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a4a7a">Operations</text>

  <rect x="722" y="430" width="120" height="45" rx="6" fill="#eaf4fb" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="782" y="457" text-anchor="middle" font-family="Arial" font-size="13" fill="#1a4a7a">HR</text>

  <!-- Left margin flow label -->
  <!-- <line x1="32" y1="160" x2="32" y2="490" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/> -->
  <!-- <text x="22" y="255" text-anchor="middle" font-family="Arial" font-size="11" fill="#555" -->
  <!--       transform="rotate(-90, 22, 255)">decisions / strategy  |  data / reports</text> -->

</svg>
