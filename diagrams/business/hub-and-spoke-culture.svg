<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <defs>
    <marker id="arrowEnd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="currentColor"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Spoke lines, bidirectional, hub edge to box edge -->

  <!-- Hub to Sales (top) -->
  <line x1="450" y1="225" x2="450" y2="112"
        stroke="currentColor" stroke-width="4"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Hub to R&amp;D (top-right) -->
  <line x1="506" y1="257" x2="568" y2="190"
        stroke="currentColor" stroke-width="4"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Hub to IT (bottom-right) -->
  <line x1="506" y1="323" x2="568" y2="390"
        stroke="currentColor" stroke-width="4"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Hub to Operations (bottom) -->
  <line x1="450" y1="355" x2="450" y2="468"
        stroke="currentColor" stroke-width="4"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Hub to HR (bottom-left) -->
  <line x1="394" y1="323" x2="332" y2="390"
        stroke="currentColor" stroke-width="4"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Hub to Finance (top-left) -->
  <line x1="394" y1="257" x2="332" y2="190"
        stroke="currentColor" stroke-width="4"
        marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/>

  <!-- Central hub: Training and Culture -->
  <circle cx="450" cy="290" r="65" fill="#d4edda" stroke="#28a745" stroke-width="2.5"/>
  <text x="450" y="277" text-anchor="middle" font-size="20" font-weight="bold" fill="#155724">Training</text>
  <text x="450" y="297" text-anchor="middle" font-size="20" font-weight="bold" fill="#155724">&amp;</text>
  <text x="450" y="317" text-anchor="middle" font-size="20" font-weight="bold" fill="#155724">Culture</text>

  <!-- Spoke nodes -->

  <!-- Sales (top: center 450, 90) -->
  <rect x="395" y="67" width="110" height="45" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="450" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">Sales</text>

  <!-- R&amp;D (top-right: center 623, 190) -->
  <rect x="568" y="167" width="110" height="45" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="623" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">R&amp;D</text>

  <!-- IT (bottom-right: center 623, 390) -->
  <rect x="568" y="367" width="110" height="45" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="623" y="395" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">IT</text>

  <!-- Operations (bottom: center 450, 490) -->
  <rect x="395" y="468" width="110" height="45" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="450" y="496" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">Operations</text>

  <!-- HR (bottom-left: center 277, 390) -->
  <rect x="222" y="367" width="110" height="45" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="277" y="395" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">HR</text>

  <!-- Finance (top-left: center 277, 190) -->
  <rect x="222" y="167" width="110" height="45" rx="6" fill="#d0e8f8" stroke="#4a90d9" stroke-width="1.8"/>
  <text x="277" y="195" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a4a7a">Finance</text>

</svg>
