<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 460" width="900" height="460">

  <defs>

    <!-- Velocity arrow (red) -->
    <marker id="vel-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>

    <!-- Axis / connection arrow (grey) -->
    <marker id="grey-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>

  </defs>

  <!-- Panel backgrounds -->
  <!-- <rect x="0"   y="0"   width="420" height="460" fill="#f0f0f4" rx="5"/> -->
  <!-- <rect x="430" y="0"   width="470" height="193" fill="#edf3fa" rx="5"/> -->
  <!-- <rect x="430" y="203" width="470" height="257" fill="#f8f8f6" rx="5"/> -->

  <!-- <line x1="425" y1="0"   x2="425" y2="460" stroke="#bbb" stroke-width="1"/> -->
  <!-- <line x1="430" y1="198" x2="900" y2="198" stroke="#bbb" stroke-width="1"/> -->

  <!-- <!-\- Panel italic labels -\-> -->
  <!-- <text x="210" y="22"  text-anchor="middle" -->
  <!--       font-family="Georgia,serif" font-size="13" font-style="italic" fill="#666">microstate</text> -->
  <!-- <text x="665" y="18"  text-anchor="middle" -->
  <!--       font-family="Georgia,serif" font-size="13" font-style="italic" fill="#666">observer</text> -->
  <!-- <text x="665" y="220" text-anchor="middle" -->
  <!--       font-family="Georgia,serif" font-size="13" font-style="italic" fill="#666">macrostate</text> -->
  

  <!-- Connecting arrows (narrative flow) -->

  <!-- Box to Observer: curved dashed arrow crossing panel divider -->
  <path d="M 388 220 C 415 220 440 109 475 109"
        fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 3"
        marker-end="url(#grey-arrow)"/>

  <!-- Observer to Gaussian: short dashed vertical arrow -->
  <line x1="665" y1="195" x2="665" y2="207"
        stroke="#999" stroke-width="1.5" stroke-dasharray="3 2"
        marker-end="url(#grey-arrow)"/>


  <!-- GROUP 1: Billiard box with stationary balls, velocity shown as red arrows -->

  <g id="billiard-box">

    <rect x="35" y="45" width="350" height="370"
          fill="#fffef9" stroke="#2c2c2c" stroke-width="3" rx="2"/>

    <!-- Velocity arrows (drawn under balls) -->
    <!-- Ball 1 centre (120,110), unit vel (0.864, 0.504), 55px shaft -->
    <line x1="131" y1="117" x2="168" y2="138"
          stroke="#c0392b" stroke-width="2.5" marker-end="url(#vel-arrow)"/>
    <!-- Ball 2 centre (260,155), unit vel (-0.822, 0.569) -->
    <line x1="249" y1="162" x2="215" y2="186"
          stroke="#c0392b" stroke-width="2.5" marker-end="url(#vel-arrow)"/>
    <!-- Ball 3 centre (90,255), unit vel (0.928,-0.371) -->
    <line x1="102" y1="250" x2="141" y2="235"
          stroke="#c0392b" stroke-width="2.5" marker-end="url(#vel-arrow)"/>
    <!-- Ball 4 centre (310,290), unit vel (-0.581,-0.813) -->
    <line x1="302" y1="279" x2="278" y2="245"
          stroke="#c0392b" stroke-width="2.5" marker-end="url(#vel-arrow)"/>
    <!-- Ball 5 centre (195,315), unit vel (0.406, 0.914) -->
    <line x1="200" y1="327" x2="217" y2="365"
          stroke="#c0392b" stroke-width="2.5" marker-end="url(#vel-arrow)"/>
    <!-- Ball 6 centre (340,92), unit vel (-0.970, 0.243) -->
    <line x1="327" y1="95"  x2="287" y2="105"
          stroke="#c0392b" stroke-width="2.5" marker-end="url(#vel-arrow)"/>

    <!-- Balls -->
    <circle cx="120" cy="110" r="13" fill="#2980b9" stroke="#1a5c88" stroke-width="2"/>
    <circle cx="260" cy="155" r="13" fill="#2980b9" stroke="#1a5c88" stroke-width="2"/>
    <circle cx="90"  cy="255" r="13" fill="#2980b9" stroke="#1a5c88" stroke-width="2"/>
    <circle cx="310" cy="290" r="13" fill="#2980b9" stroke="#1a5c88" stroke-width="2"/>
    <circle cx="195" cy="315" r="13" fill="#2980b9" stroke="#1a5c88" stroke-width="2"/>
    <circle cx="340" cy="92"  r="13" fill="#2980b9" stroke="#1a5c88" stroke-width="2"/>

  </g>


  <!-- GROUP 2: Box cover (opacity=0 in static; animate to 1 to hide microstate) -->

  <g id="box-cover" opacity="0">
    <rect x="35" y="45" width="350" height="370"
          fill="#2c2c40" rx="2" opacity="0.93"/>
    <!-- Padlock body -->
    <rect x="193" y="198" width="34" height="28" rx="5" fill="#8a8aaa"/>
    <!-- Padlock shackle -->
    <path d="M 200 198 Q 200 176 210 176 Q 220 176 220 198"
          fill="none" stroke="#8a8aaa" stroke-width="5" stroke-linecap="round"/>
    <text x="210" y="250" text-anchor="middle"
          font-family="sans-serif" font-size="12" fill="#aaa" letter-spacing="1">closed</text>
  </g>


  <!-- GROUP 3: Observer eye (nested SVG keeps internal coords isolated) -->
  <!-- Pupil id="pupil" and highlight id="highlight" exposed for animation -->

  <svg id="observer-eye" x="430" y="3" width="470" height="192" viewBox="0 0 500 200">
    <defs>
      <!-- Clip to eye outline -->
      <clipPath id="ec">
        <path d="M 50 110 C 167 15 333 15 450 110 C 333 142 167 142 50 110 Z"/>
      </clipPath>
      <!-- Iris radial gradient (objectBoundingBox coordinates) -->
      <radialGradient id="ig" cx="43%" cy="38%" r="55%">
        <stop offset="0%"   stop-color="#7ed0f5"/>
        <stop offset="52%"  stop-color="#2a80b8"/>
        <stop offset="100%" stop-color="#0f3c5a"/>
      </radialGradient>
    </defs>

    <!-- Sclera -->
    <path d="M 50 110 C 167 15 333 15 450 110 C 333 142 167 142 50 110 Z"
          fill="#fdfaf4" stroke="#222" stroke-width="2.5"/>
    <!-- Iris -->
    <circle cx="250" cy="100" r="52"
            fill="url(#ig)" clip-path="url(#ec)"/>
    <!-- Pupil (id exposed for animation: move cx/cy to track things) -->
    <circle id="pupil" cx="250" cy="100" r="24"
            fill="#0d0d0d" clip-path="url(#ec)"/>
    <!-- Specular highlight -->
    <circle id="highlight" cx="237" cy="89" r="9"
            fill="white" fill-opacity="0.88" clip-path="url(#ec)"/>
    <!-- Upper eyelid line (thick) -->
    <path d="M 50 110 C 167 15 333 15 450 110"
          fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <!-- Lower eyelid line (thin) -->
    <path d="M 450 110 C 333 142 167 142 50 110"
          fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Eyelashes: 7 quadratic bezier curves from lid tangents at t=0.08,0.20,0.34,0.50,0.66,0.80,0.92 -->
    <path d="M  79  89 Q  74  75  64  66"
          fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 125  64 Q 122  47 112  33"
          fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 183  46 Q 183  24 174   5"
          fill="none" stroke="#1a1a1a" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M 250  39 Q 255  20 250   1"
          fill="none" stroke="#1a1a1a" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M 317  46 Q 317  27 326   5"
          fill="none" stroke="#1a1a1a" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M 375  64 Q 378  50 388  33"
          fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 421  89 Q 426  79 436  66"
          fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linecap="round"/>

  </svg>


  <!-- GROUP 4: Gaussian scatter plot -->
  <!-- Centre (665, 330); scale 50px per sigma; correlated sample rho~0.7 -->

  <g id="gaussian-scatter">

    <!-- Axes -->
    <line x1="543" y1="330" x2="793" y2="330"
          stroke="#555" stroke-width="1.5" marker-end="url(#grey-arrow)"/>
    <line x1="665" y1="453" x2="665" y2="213"
          stroke="#555" stroke-width="1.5" marker-end="url(#grey-arrow)"/>

    <!-- x-axis ticks at -2sigma, -sigma, +sigma, +2sigma -->
    <line x1="565" y1="326" x2="565" y2="334" stroke="#666" stroke-width="1"/>
    <line x1="615" y1="326" x2="615" y2="334" stroke="#666" stroke-width="1"/>
    <line x1="715" y1="326" x2="715" y2="334" stroke="#666" stroke-width="1"/>
    <line x1="765" y1="326" x2="765" y2="334" stroke="#666" stroke-width="1"/>
    <!-- y-axis ticks -->
    <line x1="661" y1="430" x2="669" y2="430" stroke="#666" stroke-width="1"/>
    <line x1="661" y1="380" x2="669" y2="380" stroke="#666" stroke-width="1"/>
    <line x1="661" y1="280" x2="669" y2="280" stroke="#666" stroke-width="1"/>
    <line x1="661" y1="230" x2="669" y2="230" stroke="#666" stroke-width="1"/>

    <!-- Axis labels -->
    <text x="796" y="335" font-family="Georgia,serif" font-size="14"
          font-style="italic" fill="#444">v</text>
    <text x="803" y="338" font-family="Georgia,serif" font-size="9" fill="#444">x</text>
    <text x="657" y="212" text-anchor="end"
          font-family="Georgia,serif" font-size="14" font-style="italic" fill="#444">v</text>
    <text x="673" y="215" font-family="Georgia,serif" font-size="9" fill="#444">y</text>

    <!-- sigma label on x-axis positive tick -->
    <text x="715" y="344" text-anchor="middle"
          font-family="Georgia,serif" font-size="9" fill="#999">&#x3c3;</text>

    <!-- 1-sigma contour ellipse (rho=0.7, major semi-axis ~65, minor ~27, tilted -45deg) -->
    <ellipse cx="665" cy="330" rx="65" ry="27"
             fill="none" stroke="#2471a3" stroke-width="1.5"
             stroke-dasharray="6 3" opacity="0.7"
             transform="rotate(-45 665 330)"/>

    <!-- 32 scatter points: svg_x = 665 + 50*x, svg_y = 330 - 50*y -->
    <circle cx="575" cy="395" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="585" cy="385" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="590" cy="375" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="600" cy="405" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="610" cy="365" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="615" cy="345" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="620" cy="355" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="625" cy="365" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="630" cy="360" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="635" cy="325" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="640" cy="350" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="645" cy="370" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="650" cy="340" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="655" cy="325" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="665" cy="320" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="670" cy="345" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="675" cy="295" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="680" cy="305" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="685" cy="300" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="685" cy="335" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="690" cy="315" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="695" cy="290" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="700" cy="310" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="705" cy="275" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="710" cy="265" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="715" cy="300" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="720" cy="280" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="725" cy="285" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="730" cy="260" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="735" cy="250" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="740" cy="270" r="3.5" fill="#2471a3" opacity="0.75"/>
    <circle cx="750" cy="255" r="3.5" fill="#2471a3" opacity="0.75"/>

  </g>

</svg>
