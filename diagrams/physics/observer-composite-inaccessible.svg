  <!--    stroke-dasharray="3 2" -->
  <!--    marker-end="url(#grey-arrow)" -->
  <!--    id="line1105" /> -->
  <!-- GROUP 1: Billiard box with stationary balls, velocity shown as red arrows -->
  <g
     id="billiard-box">
    <rect
       x="35"
       y="45"
       width="350"
       height="370"
       fill="#fffef9"
       stroke="#2c2c2c"
       stroke-width="3"
       rx="2"
       id="rect1107" />
    <!-- Velocity arrows (drawn under balls) -->
  </g>
  <!-- GROUP 2: Box cover (opacity=0 in static; animate to 1 to hide microstate) -->
  <g
     id="box-cover"
     opacity="1">
    <rect
       x="35"
       y="45"
       width="350"
       height="370"
       fill="#2c2c40"
       rx="2"
       opacity="0.93"
       id="rect1134" />
    <!-- Padlock body -->
    <rect
       x="193"
       y="198"
       width="34"
       height="28"
       rx="5"
       fill="#8a8aaa"
       id="rect1136" />
    <!-- Padlock shackle -->
    <path
       d="M 200 198 Q 200 176 210 176 Q 220 176 220 198"
       fill="none"
       stroke="#8a8aaa"
       stroke-width="5"
       stroke-linecap="round"
       id="path1138" />
    <text
       x="210"
       y="250"
       text-anchor="middle"
       font-family="sans-serif"
       font-size="22"
       fill="#aaa"
       letter-spacing="1"
       id="text1140">closed</text>
  </g>
  <!-- GROUP 3: Observer eye – included from observer-eye-side.svg, flipped to look left.
       transform: translate(900,0) scale(-1,1) flips the x-axis and repositions so the
       image still occupies x=[430,900] in parent coordinates.
       preserveAspectRatio="xMidYMid slice" fills the box and crops symmetrically. -->
  <image
     id="observer-eye"
     href="observer-eye-side.svg"
     xlink:href="observer-eye-side.svg"
     x="0"
     y="3"
     width="470"
     height="250"
     transform="translate(800,50) scale(-0.5,0.5)"
     preserveAspectRatio="xMidYMid slice" />
  <!-- GROUP 4: Gaussian scatter plot -->
  <!-- Centre (665, 330); scale 50px per sigma; independent sample -->
  <g
     id="gaussian-scatter">
    <!-- Axes -->
    <line
       x1="543"
       y1="330"
       x2="793"
       y2="330"
       stroke="#555"
       stroke-width="1.5"
       marker-end="url(#grey-arrow)"
       id="line1144" />
    <line
       x1="665"
       y1="453"
       x2="665"
       y2="213"
       stroke="#555"
       stroke-width="1.5"
       marker-end="url(#grey-arrow)"
       id="line1146" />
    <!-- x-axis ticks at -2sigma, -sigma, +sigma, +2sigma -->
    <line
       x1="565"
       y1="326"
       x2="565"
       y2="334"
       stroke="#666"
       stroke-width="2"
       id="line1148" />
    <line
       x1="615"
       y1="326"
       x2="615"
       y2="334"
       stroke="#666"
       stroke-width="2"
       id="line1150" />
    <line
       x1="715"
       y1="326"
       x2="715"
       y2="334"
       stroke="#666"
       stroke-width="2"
       id="line1152" />
    <line
       x1="765"
       y1="326"
       x2="765"
       y2="334"
       stroke="#666"
       stroke-width="2"
       id="line1154" />
    <!-- y-axis ticks -->
    <line
       x1="661"
       y1="430"
       x2="669"
       y2="430"
       stroke="#666"
       stroke-width="2"
       id="line1156" />
    <line
       x1="661"
       y1="380"
       x2="669"
       y2="380"
       stroke="#666"
       stroke-width="2"
       id="line1158" />
    <line
       x1="661"
       y1="280"
       x2="669"
       y2="280"
       stroke="#666"
       stroke-width="2"
       id="line1160" />
    <line
       x1="661"
       y1="230"
       x2="669"
       y2="230"
       stroke="#666"
       stroke-width="2"
       id="line1162" />
    <!-- Axis labels -->
    <text
       x="796"
       y="335"
       font-family="Georgia,serif"
       font-size="24"
       font-style="italic"
       fill="#444"
       id="text1164">v</text>
    <text
       x="803"
       y="338"
       font-family="Georgia,serif"
       font-size="15"
       font-style="italic"
       fill="#444"
       id="text1166">x</text>
    <text
       x="657"
       y="212"
       text-anchor="end"
       font-family="Georgia,serif"
       font-size="24"
       font-style="italic"
       fill="#444"
       id="text1168">v</text>
    <text
       x="659"
       y="215"
       font-family="Georgia,serif"
       font-size="15"
       font-style="italic"
       fill="#444"
       id="text1170">y</text>
    <!-- sigma label on x-axis positive tick -->
    <text
       x="715"
       y="344"
       text-anchor="middle"
       font-family="Georgia,serif"
       font-size="15"
       fill="#999"
       id="text1172">σ</text>
    <!-- 1-sigma contour ellipse (rho=0.95, major semi-axis ~69.8, minor ~11.18, tilted 45deg) -->
    <ellipse
       cx="665"
       cy="330"
       rx="69.8"
       ry="11.18"
       fill="none"
       stroke="#2471a3"
       stroke-width="3"
       opacity="0.7"
       transform="rotate(45 665 330)"
       id="ellipse1174" />
    <ellipse
       cx="665"
       cy="330"
       rx="69.8"
       ry="11.18"
       fill="none"
       stroke="#2471a3"
       stroke-width="3"
       opacity="0.7"
       transform="rotate(-45 665 330)"
       id="ellipse1174" />
    <ellipse
       cx="665"
       cy="330"
       rx="50"
       ry="50"
       fill="none"
       stroke="#2471a3"
       stroke-width="3"
       opacity="0.7"
       transform="rotate(-45 665 330)"
       id="ellipse1174" />
  </g>

  <!-- GROUP 5: Hand-drawn question mark centred over the ellipses at (665,330).
       Drawn as a thick bezier path + dot rather than a text glyph to preserve
       the hand-made character and convey genuine uncertainty. -->
  <g id="question-mark">
    <!--
      ? body: starts at the bottom of the hook (659,338), curves upward
      through the neck (665,320) and into the top arc, which sweeps right,
      up and back left around (665,276), terminating at the opening of the hook.
      Two cubic bezier segments give the classic ? shape.
    -->
    <path
       d="M 659,338
          C 658,326 660,320 666,317
          C 676,312 686,304 686,291
          C 686,278 677,270 665,271
          C 653,272 645,280 646,292"
       fill="none"
       stroke="#2c3e50"
       stroke-width="8"
       stroke-linecap="round"
       stroke-linejoin="round"
       opacity="0.82"
       id="qmark-body"/>
    <!-- ? dot -->
    <circle
       cx="659" cy="354" r="6"
       fill="#2c3e50"
       opacity="0.82"
       id="qmark-dot"/>
  </g>

</svg>
