     inkscape:window-x="0"
     inkscape:window-y="25"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg1241" />
  <defs
     id="defs1101">
    <!-- Velocity arrow (red) -->
    <marker
       id="vel-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#c0392b"
         id="path1095" />
    </marker>
    <!-- Axis / connection arrow (grey) -->
    <marker
       id="grey-arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto">
      <path
         d="M 0,0 10,5 0,10 Z"
         fill="#888888"
         id="path1098" />
    </marker>
  </defs>
