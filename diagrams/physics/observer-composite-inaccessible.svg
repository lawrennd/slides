  <!-- Connecting arrows (narrative flow) -->
  <!-- Box to Observer: curved dashed arrow crossing panel divider -->
  <!-- Observer to Gaussian: short dashed vertical arrow -->
  <!-- <line -->
  <!--    x1="665" -->
  <!--    y1="195" -->
  <!--    x2="665" -->
  <!--    y2="207" -->
  <!--    stroke="#999" -->
