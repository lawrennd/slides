<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Side-view (profile) eye.
  Shape: arrowhead triangle pointing left; iris as vertical vesica piscis
  on the right where the triangle base would be.
  Iris/pupil colours from observer-eye.svg blue palette.
-->

<svg
   viewBox="0 0 480 370"
   width="480"
   height="370"
   version="1.1"
   id="svg801"
   sodipodi:docname="observer-eye-side.svg"
   inkscape:version="1.2.1 (9c6d41e, 2022-07-14)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview803"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showgrid="false"
     inkscape:zoom="1.3153633"
     inkscape:cx="276.72963"
     inkscape:cy="189.30132"
     inkscape:window-width="1043"
     inkscape:window-height="692"
     inkscape:window-x="367"
     inkscape:window-y="25"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg801" />
  <defs
     id="defs761">
    <!-- Blue iris gradient (userSpaceOnUse so it sits correctly on the vesica) -->
    <radialGradient
       id="iris-grad"
       cx="322"
       cy="148"
       r="118"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#7ed0f5"
         id="stop751" />
      <stop
         offset="52%"
         stop-color="#2a80b8"
         id="stop753" />
      <stop
         offset="100%"
         stop-color="#0f3c5a"
         id="stop755" />
    </radialGradient>
    <!-- Clip the highlight to the iris outline -->
    <clipPath
       id="iris-clip">
      <path
         d="M 350,90 A 104,104 0 0,0 350,270 A 104,104 0 0,0 350,90 Z"
         id="path758" />
    </clipPath>
  </defs>
  <!--
    Iris vesica piscis geometry:
      Two circles each of radius r=104, centres 104 apart.
      Left centre  (298, 180), right centre (402, 180).
      Intersection points (vertical tips): (350, 90) and (350, 270).
      Vesica width at y=180: 104px  (from x=298 to x=402).
  -->
  <!-- Sclera: cream region enclosed by the two eyelid curves and the left iris arc -->
  <path
     d="M 158,180   Q 210,115 350,80 Q 350,80 350,90   A 204,204 0 0,0 350,270 Q 350,270   350, 280 Q 210,245 158,180 Z"
     fill="#fdfaf4"
     stroke="none"
     id="path763" />
  <!-- Iris (full vesica piscis) -->
  <path
     d="M 350,90                A 204,204 0 0,0 350,270                A 204,204 0 0,0 350,90 Z"
     fill="url(#iris-grad)"
     id="path765" />
  <!--
    Pupil vesica piscis:
      r=60, centres (320,180) and (380,180).
      Vertical tips: (350,128) and (350,232).
  -->
  <path
     d="M 365,128                A 190,190 0 0,0 365, 232                A 190,190 0 0,0 365, 128 Z"
     fill="#0d0d0d"
     id="path767" />
  <!-- Specular highlight -->
  <circle
     cx="352"
     cy="122"
     r="9"
     fill="white"
     fill-opacity="0.88"
     clip-path="url(#iris-clip)"
     id="circle769" />
  <!-- ===================================================
       EYELID OUTLINES
       Upper eyelid: apex -> iris top
       Lower eyelid: apex -> iris bottom
       =================================================== -->
  <!-- Upper eyelid -->
  <path
     d="M 158,180 Q 210,115 350,80 Q 350,80 360,80"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="4.5"
     stroke-linecap="round"
     id="path771" />
  <!-- Lower eyelid -->
  <path
     d="M 158,180 Q 210,245 350,280 Q 350,280 360,280"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="3.5"
     stroke-linecap="round"
     id="path773" />
  <!-- ===================================================
       SERIFS on the triangle corners

       Apex (left): two short flared strokes, one curving
       up-left and one curving down-left, like the foot
       serifs on a capital letter.

       Iris top/bottom: small outward hooks where the
       eyelid meets the iris vesica.
       =================================================== -->
  <!-- Apex serif: upper flare -->
  <path
     d="M 158,180 Q 72,163 55,148"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="4.0"
     stroke-linecap="round"
     id="path775" />
  <!-- Apex serif: lower flare -->
  <path
     d="M 158,180 Q 72,197 55,212"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="3.5"
     stroke-linecap="round"
     id="path777" />
  <!-- Iris-top serif (hook at end of upper eyelid) -->
  <path
     d="m 360,80 c 10.66667,-9.333333 31.77801,-25.602462 34.44468,-33.602462"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2"
     stroke-linecap="round"
     id="path779"
     sodipodi:nodetypes="cc" />
  <!-- Iris-bottom serif (hook at end of lower eyelid) -->
  <path
     d="M 360,280 Q 376,294 380,306"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2"
     stroke-linecap="round"
     id="path781" />
  <!-- ===================================================
       UPPER EYELASHES
       Bases sampled along the upper-eyelid bezier.
       Directions perpendicular to the lid, pointing outward.
       =================================================== -->
  <!-- t=0.22  base ~(148,149)  direction: up-left -->
  <path
     d="m 188,149 c -6,-13.33333 -6.67828,-13.40915 -12.67828,-26.07581"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2.3"
     stroke-linecap="round"
     id="path783"
     sodipodi:nodetypes="cc" />
  <!-- t=0.35  base ~(185,132)  direction: up -->
  <path
     d="m 210,132 c -2.66667,-14.66667 -1.10519,-14.55532 -5.19877,-33.877045"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2.5"
     stroke-linecap="round"
     id="path785"
     sodipodi:nodetypes="cc" />
  <!-- t=0.50  base ~(218,121)   direction: up -->
  <path
     d="M 238,121 q -1,-23 -2,-40"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2.7"
     stroke-linecap="round"
     id="path787" />
  <!-- t=0.64  base ~(258,108)   direction: up -->
  <path
     d="m 269.40369,104.19877 c 0.50926,-14.314812 1.08904,-27.488588 -1,-45.000001"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2.7"
     stroke-linecap="round"
     id="path789"
     sodipodi:nodetypes="cc" />
  <!-- t=0.78  base ~(300,90)   direction: up, slight right -->
  <path
     d="m 302.28074,90 c 2,-15.333333 6.70765,-20.450132 11.08197,-49.561477"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2.5"
     stroke-linecap="round"
     id="path791"
     sodipodi:nodetypes="cc" />
  <!-- t=0.90  base ~(334,84)   direction: up-right -->
  <path
     d="m 334,84 c 2.21784,-13.737092 7.86921,-14.657288 18.12295,-47.523273"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2.2"
     stroke-linecap="round"
     id="path793"
     sodipodi:nodetypes="cc" />
  <!-- ===================================================
       LOWER EYELASHES
       Bases sampled along the lower-eyelid bezier.
       =================================================== -->
  <!-- t=0.22  base ~(148,213)  direction: down-left -->
  <path
     d="m 188,213 c -6,13.33333 -3.19455,6.98062 -9.86122,19.64729"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="1.9"
     stroke-linecap="round"
     id="path795"
     sodipodi:nodetypes="cc" />
  <!-- t=0.50  base ~(218,239)  direction: down -->
  <path
     d="m 237.12295,242.04098 c 0.3188,13.38512 -0.52952,16.90267 -2.23697,22.64729"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="2"
     stroke-linecap="round"
     id="path797"
     sodipodi:nodetypes="cc" />
  <!-- t=0.78  base ~(300,267)  direction: down-right -->
  <path
     d="m 300,267 c 1.33333,14 1.59152,6.57079 2.92485,19.90413"
     fill="none"
     stroke="#0d0d0d"
     stroke-width="1.9"
     stroke-linecap="round"
     id="path799"
     sodipodi:nodetypes="cc" />
</svg>
